name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv build

  publiccode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: italia/publiccode-parser-action@v1
        with:
          publiccode: publiccode.yml
          no-network: true

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group bench
      - run: uv run --no-sync python -m benchmarks.run --check
      - run: uv run --no-sync python -m benchmarks.faithful score --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: The command line and the demo start
        run: |
          docker compose run --rm cli --help
          docker compose up -d
          for i in $(seq 30); do
            curl -fs http://localhost:3000/api/health && curl -fs -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
