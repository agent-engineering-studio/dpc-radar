[project]
name = "dpc-radar"
version = "0.2.1"
description = "Async Python client for the Italian Civil Protection (DPC) open radar data: SRI, Merging (CUM), history and criticality bulletins"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Zileni", email = "giuseppe.zileni@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "rasterio>=1.4",
]

[project.optional-dependencies]
# IT-DPC-SRI, the 2010-2025 radar history: the Blosc codec of its Zarr store.
history = ["numcodecs>=0.13"]
# The DPC criticality bulletin: the shapes of its alert zones.
bulletins = ["shapely>=2.0"]

[project.urls]
Homepage = "https://github.com/agent-engineering-studio/dpc-radar"
Issues = "https://github.com/agent-engineering-studio/dpc-radar/issues"
Documentation = "https://agentengineering.it/dpc-radar/"
Changelog = "https://github.com/agent-engineering-studio/dpc-radar/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "numcodecs>=0.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "shapely>=2.0",
    "ruff>=0.8",
]
bench = [
    "httpx>=0.27",
    "numpy>=2.0",
    "rasterio>=1.4",
]
docs = [
    "zensical>=0.1.0",
    "mkdocstrings[python]>=0.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B018"]
# The image script draws labels with typographic signs (×, –, −) on purpose.
"docs/**" = ["RUF001"]
# Baseline methods implement an interface: not every method uses every argument.
"benchmarks/methods.py" = ["ARG002"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["rasterio.*", "affine.*", "numcodecs.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real DPC API (run with -m live)"]

[tool.coverage.run]
source = ["dpc_radar"]

[tool.coverage.report]
fail_under = 90
show_missing = true
