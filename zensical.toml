[project]
site_name = "dpc-radar"
site_description = "Rain over Italy from the Civil Protection radar, in a few lines of Python"
site_url = "https://agentengineering.it/dpc-radar/"
repo_url = "https://github.com/agent-engineering-studio/dpc-radar"
repo_name = "agent-engineering-studio/dpc-radar"
edit_uri = "edit/main/docs/"
copyright = "Code Apache-2.0. Radar data © Dipartimento della Protezione Civile, CC BY-SA 4.0."

nav = [
  { "Home" = "index.md" },
  { "API reference" = [
    { "Client" = "api/client.md" },
    { "Rain grid" = "api/grid.md" },
    { "Archive" = "api/archive.md" },
    { "History (IT-DPC-SRI)" = "api/history.md" },
    { "Criticality bulletins" = "api/bulletins.md" },
    { "Products and API" = "api/products.md" },
    { "Errors" = "api/errors.md" },
  ] },
  { "Benchmark" = "benchmark.md" },
  { "Roadmap and AI" = "roadmap.md" },
  { "Changelog" = "changelog.md" },
  { "Contributing" = "contributing.md" },
]

# The README is written for GitHub: its relative links (LICENSE, CHANGELOG)
# point at the repository, not at the site.
[project.validation.links]
not_found = "info"
unrecognized_links = "info"
anchors = "info"

[project.theme]
features = [
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue grey"
toggle.icon = "material/weather-night"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue grey"
toggle.icon = "material/weather-sunny"
toggle.name = "Light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = false
members_order = "source"
separate_signature = true
show_signature_annotations = true
filters = ["!^_"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
