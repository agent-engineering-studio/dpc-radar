# dpc-radar on this machine, with nothing to install but Docker.
#
#   docker compose up                          the demo, on http://localhost:3000
#   docker compose run --rm init               download two days of frames
#   docker compose run --rm cli --help         the command line
#   docker compose run --rm python             Python, with dpc_radar to import
#
#   DPC_RADAR_PORT   the port of the demo (default 3000)
#   DPC_RADAR_LAT, DPC_RADAR_LON, DPC_RADAR_PLACE
#                    where the map opens, and the name shown: the municipality
#                    that hosts the page (default: Gioia del Colle). See .env.example.
#   DPC_RADAR_DAYS   how many days of frames `init` downloads (default 2)
#   DATA_ROOT        the data folder shared with Limen and the other libraries:
#                    the library's own folder is $DATA_ROOT/dpc-radar (default
#                    ./data/dpc-radar). Create it first, so that it is yours.
name: dpc-radar

x-radar: &radar
  image: dpc-radar:local
  build: .
  environment:
    DATA_ROOT: /data
  volumes:
    - radar-data:/data
    - ${DATA_ROOT:-./data}/dpc-radar:/data/dpc-radar

services:
  # What the page asks: the library, behind a few URLs (demo/api.py).
  api:
    <<: *radar
    container_name: dpc-radar-api
    restart: unless-stopped

  # The page: a map of Italy, and a card for whatever is clicked (demo/web).
  web:
    image: dpc-radar-web:local
    container_name: dpc-radar-web
    build: demo/web
    environment:
      DPC_RADAR_API: http://api:8000
      DPC_RADAR_LAT: ${DPC_RADAR_LAT:-}
      DPC_RADAR_LON: ${DPC_RADAR_LON:-}
      DPC_RADAR_ZOOM: ${DPC_RADAR_ZOOM:-}
      DPC_RADAR_PLACE: ${DPC_RADAR_PLACE:-}
      DPC_RADAR_LAYER: ${DPC_RADAR_LAYER:-}
      DPC_RADAR_TILES: ${DPC_RADAR_TILES:-}
      DPC_RADAR_TILES_CREDIT: ${DPC_RADAR_TILES_CREDIT:-}
    depends_on:
      - api
    ports:
      - "${DPC_RADAR_PORT:-3000}:3000"
    restart: unless-stopped

  # One shot: the frames of the last days, for the reports of a day.
  init:
    <<: *radar
    profiles: [tools]
    command: ["sh", "scripts/fetch-data.sh"]
    environment:
      DATA_ROOT: /data
      DPC_RADAR_DAYS: ${DPC_RADAR_DAYS:-2}

  cli:
    <<: *radar
    profiles: [tools]
    entrypoint: ["dpc-radar"]

  python:
    <<: *radar
    profiles: [tools]
    command: ["python"]
    stdin_open: true
    tty: true

volumes:
  # The frames and the reports: kept between one run and the next.
  radar-data:
