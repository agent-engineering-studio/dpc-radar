# dpc-radar on this machine, with nothing to install but Docker.
#
#   docker compose up                          the demo, on http://localhost:3000
#   docker compose run --rm init               download two days of frames
#   docker compose run --rm cli --help         the command line
#   docker compose run --rm python             Python, with dpc_radar to import
#
#   DPC_RADAR_PORT   the port of the demo (default 3000)
#   DPC_RADAR_DAYS   how many days of frames `init` downloads (default 2)
name: dpc-radar

x-radar: &radar
  image: dpc-radar:local
  build: .
  volumes:
    - radar-data:/data

services:
  # What the page asks: the library, behind a few URLs (demo/api.py).
  api:
    <<: *radar
    restart: unless-stopped

  # The page: a map of Italy, and a card for whatever is clicked (demo/web).
  web:
    image: dpc-radar-web:local
    build: demo/web
    environment:
      DPC_RADAR_API: http://api:8000
    depends_on:
      - api
    ports:
      - "${DPC_RADAR_PORT:-3000}:3000"
    restart: unless-stopped

  # One shot: the frames of the last days, for the reports of a day.
  init:
    <<: *radar
    profiles: [tools]
    command: ["sh", "scripts/fetch-data.sh"]
    environment:
      DPC_RADAR_DAYS: ${DPC_RADAR_DAYS:-2}

  cli:
    <<: *radar
    profiles: [tools]
    entrypoint: ["dpc-radar"]

  python:
    <<: *radar
    profiles: [tools]
    command: ["python"]
    stdin_open: true
    tty: true

volumes:
  # The frames and the reports: kept between one run and the next.
  radar-data:
