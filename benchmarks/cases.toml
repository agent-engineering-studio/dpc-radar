time = 2026-10-07T12:00:00Z
bbox = [13.2, 41.4, 14.4, 42.2]
source = "found while building this benchmark: a 3x3 km bump of 940-1,152 mm, the same in the :00 and :30 series. Confirmed on the 3-hour frames: CUM3 reads 126.6 mm here in every window from 6 October 12 UTC to 7 October 09 UTC (126.62, 126.63, 126.63, 126.79) and 114-143 mm until 21 UTC, about 1,400 mm in 33 hours, while the radar alone (SRT1) reads 0.0 in all those hours; at 03 UTC of the 8th it is back to 0. No rain does that: one gauge of the «Merging» was stuck"

